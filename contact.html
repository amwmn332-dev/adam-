<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا | إكسسوار آدم</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .contact-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
        }
        .contact-container h1 {
            color: #1a252f;
            margin-bottom: 10px;
        }
        .contact-container p {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .social-card {
            background: #f4f6f9;
            padding: 20px;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .social-card:hover {
            transform: translateY(-3px);
            background: #1a252f;
            color: white;
        }
        .social-card i {
            font-size: 30px;
        }
        .whatsapp { color: #25d366; }
        .facebook { color: #1877f2; }
        .instagram { color: #e1306c; }
        .phone { color: #e67e22; }
        
        .social-card:hover i {
            color: white !important;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">
            <a href="index.html" style="color: inherit; text-decoration: none;"><i class="fas fa-bicycle"></i> إكسسوار آدم</a>
        </div>
        <div>
            <a href="index.html" style="color: white; text-decoration: none; font-weight: bold;"><i class="fas fa-home"></i> الرئيسية</a>
        </div>
    </header>

    <div class="contact-container">
        <h1>تواصل معنا</h1>
        <p>نحن هنا لمساعدتك والرد على استفساراتك طوال أيام الأسبوع</p>
        
        <div class="social-grid">
            <!-- واتساب -->
            <a href="https://wa.me/201029290236" target="_blank" class="social-card">
                <i class="fab fa-whatsapp whatsapp"></i>
                <span>راسلنا عبر واتساب</span>
            </a>

            <!-- الهاتف -->
            <a href="tel:01097641577" class="social-card">
                <i class="fas fa-phone-alt phone"></i>
                <span>اتصل بنا مباشرة</span>
            </a>

            <!-- فيسبوك -->
            <a href="https://www.facebook.com/share/1DNVk5Zmhg/?mibextid=wwXIfr" target="_blank" class="social-card">
                <i class="fab fa-facebook facebook"></i>
                <span>صفحتنا على فيسبوك</span>
            </a>

            <!-- إنستغرام -->
            <a href="https://www.instagram.com/adam_accessorie?stkn=MWV4YjU0bWEzdmcwZg==" target="_blank" class="social-card">
                <i class="fab fa-instagram instagram"></i>
                <span>حسابنا على إنستغرام</span>
            </a>
        </div>
    </div>

</body>
</html>
